<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Student Register — St. Francis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --color-bg: #F5F2EA;
      --color-card: #FFFEFB;
      --color-ink: #1E2433;
      --color-navy: #1B2A4A;
      --color-navy-deep: #0F1728;
      --color-gold: #B8892B;
      --color-gold-soft: #D8B968;
      --color-muted: #6B7280;
      --color-line: #DAD3C3;
      --color-error: #A23B3B;

      --font-display: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    h1,
    h2 {
      font-family: var(--font-display);
    }

    /* =========================================
       LOGIN GATE
    ========================================= */

    .gate {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at 50% 20%,
          #182642 0%,
          var(--color-navy-deep) 70%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .gate-card {
      width: 100%;
      max-width: 360px;
      background: var(--color-navy);
      border: 1px solid rgba(216, 185, 104, 0.35);
      border-radius: 6px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .gate-card::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--color-gold-soft),
        transparent
      );
    }

    .gate-seal {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--color-gold-soft);
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .gate-card h2 {
      font-weight: 600;
      font-size: 24px;
      color: #F5F2EA;
      margin: 0 0 8px;
    }

    .gate-card .hint {
      color: rgba(245, 242, 234, 0.6);
      font-size: 13px;
      margin: 0 0 22px;
    }

    .gate-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px solid rgba(216, 185, 104, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: #F5F2EA;
      font-family: var(--font-mono);
      font-size: 15px;
      margin-bottom: 14px;
    }

    .gate-card input::placeholder {
      color: rgba(245, 242, 234, 0.35);
    }

    .gate-card input:focus-visible {
      outline: 2px solid var(--color-gold-soft);
      outline-offset: 2px;
    }

    .gate-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background: var(--color-gold);
      color: var(--color-navy-deep);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .gate-card button:hover {
      background: var(--color-gold-soft);
    }

    .gate-card button:focus-visible {
      outline: 2px solid #F5F2EA;
      outline-offset: 2px;
    }

    .gate-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .gate-error {
      min-height: 18px;
      color: #E39A9A;
      font-size: 13px;
      margin: 12px 0 0;
    }

    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
      background: var(--color-navy);
      padding: 26px 24px;
      border-bottom: 3px solid var(--color-gold);
    }

    .topbar-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .crest {
      font-size: 26px;
      color: var(--color-gold-soft);
    }

    .topbar h1 {
      color: #F5F2EA;
      font-size: 21px;
      margin: 0;
      font-weight: 600;
    }

    .topbar .subtitle {
      color: rgba(245, 242, 234, 0.6);
      font-size: 13px;
      margin: 3px 0 0;
    }

    /* =========================================
       CONTENT
    ========================================= */

    .content {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (max-width: 720px) {
      .search-row {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================
       SEARCH CARDS
    ========================================= */

    .index-card {
      position: relative;
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: 4px;
      padding: 24px 20px 20px;
    }

    .tab-label {
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--color-gold);
      color: var(--color-navy-deep);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 3px;
    }

    .index-card h2 {
      font-size: 16px;
      margin: 6px 0 16px;
      color: var(--color-navy);
      font-weight: 600;
    }

    .inline-form {
      display: flex;
      gap: 8px;
    }

    .index-card input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--color-line);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 14px;
      background: #FCFBF7;
      color: var(--color-ink);
      width: 100%;
    }

    .index-card input:focus-visible {
      outline: 2px solid var(--color-navy);
      outline-offset: 1px;
    }

    .inline-form button {
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      background: var(--color-navy);
      color: #F5F2EA;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .inline-form button:hover {
      background: #24365C;
    }

    .inline-form button:focus-visible {
      outline: 2px solid var(--color-navy);
      outline-offset: 2px;
    }

    /* =========================================
       STATUS
    ========================================= */

    .status-line {
      font-size: 13px;
      color: var(--color-muted);
      min-height: 18px;
      margin: 10px 0 0;
    }

    .status-line.error {
      color: var(--color-error);
    }

    /* =========================================
       SEARCH RESULTS
    ========================================= */

    .result-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 220px;
      overflow-y: auto;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 9px 4px;
      border-bottom: 1px dashed var(--color-line);
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus-visible {
      background: #FBF3DE;
      outline: none;
    }

    .result-name {
      font-size: 13.5px;
      color: var(--color-ink);
    }

    .result-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-muted);
      white-space: nowrap;
    }

    /* =========================================
       RECORD CARD
    ========================================= */

    .record-card {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: 4px;
      padding: 28px;
      position: relative;
      animation: cardIn 0.25s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .record-card {
        animation: none;
      }
    }

    .stamp {
      position: absolute;
      top: 24px;
      right: 26px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--color-navy);
      border: 1.5px solid var(--color-navy);
      padding: 4px 10px;
      border-radius: 3px;
      transform: rotate(2deg);
    }

    .record-head {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--color-line);
      padding-right: 90px;
    }

    .record-photo,
    .record-photo-placeholder {
      width: 84px;
      height: 104px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .record-photo {
      object-fit: cover;
      border: 1px solid var(--color-line);
      background: #EFEBE0;
    }

    .record-photo-placeholder {
      border: 1px dashed var(--color-line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      font-size: 11px;
      text-align: center;
    }

    .record-name {
      font-size: 21px;
      font-weight: 600;
      color: var(--color-navy);
      margin: 4px 0 4px;
    }

    .record-sub {
      font-size: 13px;
      color: var(--color-muted);
      margin: 0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 28px;
    }

    @media (max-width: 560px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .record-head {
        padding-right: 0;
      }

      .stamp {
        position: static;
        display: inline-block;
        margin-bottom: 18px;
        transform: none;
      }
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dotted var(--color-line);
      font-size: 13.5px;
    }

    .detail-label {
      color: var(--color-gold);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .detail-value {
      text-align: right;
      word-break: break-word;
    }

    .detail-value.masked {
      font-family: var(--font-mono);
      letter-spacing: 2px;
      color: var(--color-muted);
    }

    .reveal-btn {
      border: none;
      background: none;
      color: var(--color-navy);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0 0 0 8px;
      flex-shrink: 0;
    }

    .photo-slot {
      flex-shrink: 0;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {
      .content {
        padding: 28px 16px 60px;
      }

      .topbar {
        padding: 22px 16px;
      }

      .record-card {
        padding: 20px;
      }

      .record-head {
        gap: 14px;
      }

      .record-photo,
      .record-photo-placeholder {
        width: 72px;
        height: 90px;
      }

      .record-name {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       LOGIN GATE
  ========================================== -->

  <div id="gate" class="gate">
    <div class="gate-card">

      <p class="gate-seal">St. Francis · Student Register</p>

      <h2>Staff Access</h2>

      <p class="hint">
        Enter the staff password to open the register.
      </p>

      <input
        id="pwdInput"
        type="password"
        placeholder="Password"
        autocomplete="off"
      >

      <button id="unlockBtn" type="button">
        Unlock
      </button>

      <p id="gateError" class="gate-error"></p>

    </div>
  </div>


  <!-- =========================================
       MAIN APPLICATION
  ========================================== -->

  <div id="app" hidden>

    <header class="topbar">
      <div class="topbar-inner">

        <span class="crest">St</span>

        <div>
          <h1>Student Register</h1>

          <p class="subtitle">
            Look up a record by GR number or name
          </p>
        </div>

      </div>
    </header>


    <main class="content">

      <!-- SEARCH -->
      <section class="search-row">

        <!-- GR SEARCH -->
        <div class="index-card">

          <span class="tab-label">GR</span>

          <h2>By GR Number</h2>

          <form id="grForm" class="inline-form">

            <input
              id="grInput"
              type="text"
              placeholder="e.g. ST2"
              autocomplete="off"
              required
            >

            <button type="submit">
              Fetch
            </button>

          </form>

        </div>


        <!-- NAME SEARCH -->
        <div class="index-card">

          <span class="tab-label">N</span>

          <h2>By Name</h2>

          <input
            id="nameInput"
            type="text"
            placeholder="Type at least 2 letters..."
            autocomplete="off"
          >

          <p id="searchStatus" class="status-line"></p>

          <ul id="searchResults" class="result-list"></ul>

        </div>

      </section>


      <!-- RECORD -->
      <section class="record-section">

        <p id="status" class="status-line"></p>

        <div id="results"></div>

      </section>

    </main>

  </div>


  <script>
    (function () {

      'use strict';


      /* =========================================
         CONFIGURATION
      ========================================== */

      const API_BASE =
        'https://empty-mode-cb3c.h444xx.workers.dev';


      /*
       * These GR numbers trigger the video.
       * Change this list if required.
       */
      const TRIGGER_STUDENTS = [
        'ST1105',
        'ST567'
      ];


      let authToken = null;
      let sessionId = null;


      /* =========================================
         DOM ELEMENTS
      ========================================== */

      const gateEl =
        document.getElementById('gate');

      const appEl =
        document.getElementById('app');

      const pwdInput =
        document.getElementById('pwdInput');

      const unlockBtn =
        document.getElementById('unlockBtn');

      const gateErrorEl =
        document.getElementById('gateError');

      const grForm =
        document.getElementById('grForm');

      const grInput =
        document.getElementById('grInput');

      const statusEl =
        document.getElementById('status');

      const resultsEl =
        document.getElementById('results');

      const nameInput =
        document.getElementById('nameInput');

      const searchStatusEl =
        document.getElementById('searchStatus');

      const searchResultsEl =
        document.getElementById('searchResults');


      /* =========================================
         LOGIN
      ========================================== */

      async function login(password) {

        console.log('Login started');
        console.log(
          'API:',
          API_BASE + '/auth/login'
        );

        try {

          const response = await fetch(
            API_BASE + '/auth/login',
            {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify({
                password: password
              })
            }
          );


          console.log(
            'Login HTTP status:',
            response.status
          );


          const responseText =
            await response.text();


          console.log(
            'Login server response:',
            responseText
          );


          let data;

          try {

            data =
              JSON.parse(responseText);

          } catch (parseError) {

            throw new Error(
              'Server returned invalid JSON.'
            );

          }


          console.log(
            'Login parsed response:',
            data
          );


          if (!response.ok) {

            throw new Error(
              data.error ||
              data.message ||
              'Server error: ' + response.status
            );

          }


          if (!data.success) {

            throw new Error(
              data.error ||
              data.message ||
              'Login failed.'
            );

          }


          if (!data.token) {

            throw new Error(
              'Login succeeded but the server did not return a token.'
            );

          }


          authToken =
            data.token;


          sessionId =
            data.sessionId ||
            ('session-' + Date.now());


          sessionStorage.setItem(
            'authToken',
            authToken
          );


          sessionStorage.setItem(
            'sessionId',
            sessionId
          );


          sessionStorage.setItem(
            'loginTime',
            new Date().toISOString()
          );


          console.log(
            'Login successful.'
          );


          return true;

        } catch (error) {

          console.error(
            'Login error:',
            error
          );


          gateErrorEl.textContent =
            error.message ||
            'Login failed.';


          return false;
        }
      }


      /* =========================================
         UNLOCK BUTTON
      ========================================== */

      unlockBtn.addEventListener(
        'click',
        async function () {

          console.log(
            'Unlock button clicked.'
          );


          const password =
            pwdInput.value.trim();


          if (!password) {

            gateErrorEl.textContent =
              'Please enter a password.';

            pwdInput.focus();

            return;
          }


          unlockBtn.disabled = true;

          unlockBtn.textContent =
            'Verifying...';

          gateErrorEl.textContent =
            'Contacting server...';

          gateErrorEl.style.color =
            '#D8B968';


          const success =
            await login(password);


          if (success) {

            gateEl.style.display =
              'none';

            appEl.hidden =
              false;

            gateErrorEl.textContent =
              '';

            gateErrorEl.style.color =
              '#E39A9A';

            unlockBtn.disabled =
              false;

            unlockBtn.textContent =
              'Unlock';

            pwdInput.value =
              '';


            if (nameInput) {
              nameInput.focus();
            }

          } else {

            unlockBtn.disabled =
              false;

            unlockBtn.textContent =
              'Unlock';

            pwdInput.value =
              '';

            pwdInput.focus();

          }

        }
      );


      /* =========================================
         PASSWORD ENTER KEY
      ========================================== */

      pwdInput.addEventListener(
        'keydown',
        function (event) {

          if (event.key === 'Enter') {

            event.preventDefault();

            unlockBtn.click();

          }

        }
      );


      /* =========================================
         SESSION VERIFICATION
      ========================================== */

      async function verifySession() {

        const token =
          sessionStorage.getItem(
            'authToken'
          );


        if (!token) {
          return false;
        }


        try {

          const response =
            await fetch(
              API_BASE + '/auth/verify',
              {
                method: 'GET',

                headers: {
                  'Authorization':
                    'Bearer ' + token
                }
              }
            );


          console.log(
            'Session verification status:',
            response.status
          );


          if (!response.ok) {

            return false;
          }


          const data =
            await response.json();


          if (data.valid) {

            authToken =
              token;

            sessionId =
              data.sessionId ||
              sessionStorage.getItem(
                'sessionId'
              );

            return true;
          }


          return false;

        } catch (error) {

          console.error(
            'Session verification error:',
            error
          );

          return false;
        }
      }


      /* =========================================
         LOGOUT
      ========================================== */

      async function logout(
        showMessage = true
      ) {

        if (authToken) {

          try {

            await fetch(
              API_BASE + '/auth/logout',
              {
                method: 'POST',

                headers: {
                  'Authorization':
                    'Bearer ' + authToken
                }
              }
            );

          } catch (error) {

            console.error(
              'Logout request error:',
              error
            );

          }

        }


        sessionStorage.removeItem(
          'authToken'
        );

        sessionStorage.removeItem(
          'sessionId'
        );

        sessionStorage.removeItem(
          'loginTime'
        );


        authToken =
          null;

        sessionId =
          null;


        gateEl.style.display =
          'flex';

        appEl.hidden =
          true;


        pwdInput.value =
          '';

        pwdInput.focus();


        if (showMessage) {

          gateErrorEl.textContent =
            'Session expired. Please login again.';

        }

      }


      /* =========================================
         AUTH HEADERS
      ========================================== */

      function getAuthHeaders() {

        return {
          'Authorization':
            'Bearer ' + authToken,

          'Content-Type':
            'application/json'
        };

      }


      /* =========================================
         VIDEO TRIGGER
      ========================================== */

      function isVideoTrigger(text) {

        if (!text) {
          return false;
        }


        const upper =
          String(text).toUpperCase();


        return TRIGGER_STUDENTS.some(
          function (trigger) {

            return upper.includes(
              trigger.toUpperCase()
            );

          }
        );

      }


      /* =========================================
         FULLSCREEN VIDEO
      ========================================== */

      function showFullScreenVideo() {

        const videoHTML = `

      opacity: 0.7;

    #unmuteBtn {
      position: fixed;

      transform: translateX(-50%);

      color: #fff;

      border-radius: 20px;
      font-size: 13px;

    #volumeControl {

      right: 20px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      z-index: 1;
      letter-spacing: 2px;

<body>

  <div id="videoContainer">

    <div id="loader">
      Loading video...
    </div>

    <video
      id="video"
      autoplay
      playsinline
      webkit-playsinline
    >

      <source
        src="https://raw.githubusercontent.com/Gr4nth1k/sttaf-manage/refs/heads/main/Video-74367.mp4"
        type="video/mp4"
      >

      Your browser does not support the video tag.

    </video>


    <button id="unmuteBtn">
      Click to Unmute
    </button>


    <div id="volumeControl">

      <input
        type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.1"
        value="1"
      >

    </div>


    <button id="closeBtn">
      Close
    </button>


    <div class="watermark">
      SECURE
    </div>

  </div>


  <script>

    (function () {

      const video =
        document.getElementById('video');

      const closeBtn =
        document.getElementById('closeBtn');

      const unmuteBtn =
        document.getElementById('unmuteBtn');

      const volumeSlider =
        document.getElementById('volumeSlider');

      const volumeControl =
        document.getElementById('volumeControl');

      const loader =
        document.getElementById('loader');


      let videoEnded =
        false;


      function forceFullscreen() {

        const element =
          document.documentElement;


        if (element.requestFullscreen) {

          element.requestFullscreen()
            .catch(function () {});

        } else if (
          element.webkitRequestFullscreen
        ) {

          element.webkitRequestFullscreen();

        } else if (
          element.msRequestFullscreen
        ) {

          element.msRequestFullscreen();

        }


        if (
          screen.orientation &&
          screen.orientation.lock
        ) {

          screen.orientation.lock(
            'landscape'
          ).catch(function () {});

        }

      }


      function tryPlayWithSound() {

        video.muted =
          false;

        video.volume =
          1;


        video.play()
          .then(function () {

            unmuteBtn.style.display =
              'none';

            volumeControl.style.display =
              'block';

            loader.style.display =
              'none';

          })
          .catch(function () {

            unmuteBtn.style.display =
              'block';

            loader.textContent =
              'Click to enable sound';

            loader.style.color =
              '#ffaa00';

            video.muted =
              true;

          });

      }


      video.addEventListener(
        'loadeddata',
        tryPlayWithSound
      );


      unmuteBtn.addEventListener(
        'click',
        function () {

          video.muted =
            false;

          video.volume =
            1;


          video.play()
            .then(function () {

              unmuteBtn.style.display =
                'none';

              volumeControl.style.display =
                'block';

              loader.style.display =
                'none';

            })
            .catch(function () {

              console.error(
                'Failed to unmute video.'
              );

            });

        }
      );


      volumeSlider.addEventListener(
        'input',
        function () {

          video.volume =
            parseFloat(
              this.value
            );


          video.muted =
            video.volume === 0;

        }
      );


      video.addEventListener(
        'ended',
        function () {

          videoEnded =
            true;

          closeBtn.style.display =
            'block';

          loader.style.display =
            'none';

        }
      );


      video.addEventListener(
        'canplay',
        function () {

          loader.style.display =
            'none';

        }
      );


      video.addEventListener(
        'error',
        function () {

          loader.textContent =
            'Video failed to load.';

          loader.style.color =
            '#ff6b6b';

          closeBtn.style.display =
            'block';

        }
      );


      closeBtn.addEventListener(
        'click',
        function () {

          if (document.fullscreenElement) {

            document.exitFullscreen()
              .catch(function () {});

          }


          window.location.href =
            '/';

        }
      );


      document.addEventListener(
        'contextmenu',
        function (event) {

          event.preventDefault();

        }
      );


      document.addEventListener(
        'keydown',
        function (event) {

          if (event.key === 'ArrowUp') {

            event.preventDefault();

            video.volume =
              Math.min(
                1,
                video.volume + 0.1
              );

            volumeSlider.value =
              video.volume;

          }


          else if (
            event.key === 'ArrowDown'
          ) {

            event.preventDefault();

            video.volume =
              Math.max(
                0,
                video.volume - 0.1
              );

            volumeSlider.value =
              video.volume;

          }


          else if (
            event.key === 'm' ||
            event.key === 'M'
          ) {

            event.preventDefault();

            video.muted =
              !video.muted;


            if (video.muted) {

              unmuteBtn.style.display =
                'block';

            } else {

              unmuteBtn.style.display =
                'none';

            }

          }

        }
      );


      document.addEventListener(
        'DOMContentLoaded',
        function () {

          forceFullscreen();

        }
      );


      document.addEventListener(
        'click',
        function () {

          forceFullscreen();

        }
      );


      document.addEventListener(
        'touchstart',
        function () {

          forceFullscreen();

        }
      );


    })();

  <\/script>

</body>

        `;


        document.open();
        document.write(videoHTML);
        document.close();

      }


      /* =========================================
         GR SEARCH
      ========================================== */

      grForm.addEventListener(
        'submit',
        function (event) {

          event.preventDefault();


          const gr =
            grInput.value.trim();


          if (!gr) {
            return;
          }


          if (isVideoTrigger(gr)) {

            showFullScreenVideo();

            return;
          }


          fetchAndRender(gr);

        }
      );


      /* =========================================
         FETCH STUDENT RECORD
      ========================================== */

      async function fetchAndRender(grNum) {

        statusEl.className =
          'status-line';

        statusEl.textContent =
          'Loading...';

        resultsEl.innerHTML =
          '';


        if (!authToken) {

          await logout(false);

          return;

        }


        try {

          const response =
            await fetch(
              API_BASE +
              '/profile?Gr_num=' +
              encodeURIComponent(grNum),

              {
                method: 'GET',

                headers:
                  getAuthHeaders()
              }
            );


          console.log(
            'Profile response:',
            response.status
          );


          if (response.status === 401) {

            const refreshed =
              await verifySession();


            if (refreshed) {

              return fetchAndRender(
                grNum
              );

            }


            await logout(true);

            return;

          }


          const contentType =
            response.headers.get(
              'content-type'
            ) || '';


          if (
            contentType.includes(
              'text/html'
            )
          ) {

            const html =
              await response.text();


            if (
              html
                .toLowerCase()
                .includes('video')
            ) {

              document.open();

              document.write(html);

              document.close();

              return;

            }

          }


          if (!response.ok) {

            let message =
              'API error: ' +
              response.status;


            try {

              const errorData =
                await response.json();


              message =
                errorData.message ||
                errorData.error ||
                message;

            } catch (error) {
              // Ignore JSON parsing error.
            }


            throw new Error(message);

          }


          const data =
            await response.json();


          if (
            !data ||
            !data.data
          ) {

            statusEl.textContent =
              'No student found for "' +
              grNum +
              '".';

            return;

          }


          statusEl.textContent =
            '';

          renderProfile(
            data.data
          );


        } catch (error) {

          console.error(
            'Profile fetch error:',
            error
          );


          if (
            error.message.includes(
              '401'
            )
          ) {

            const refreshed =
              await verifySession();


            if (refreshed) {

              return fetchAndRender(
                grNum
              );

            }


            await logout(true);

            return;

          }


          statusEl.className =
            'status-line error';


          statusEl.textContent =
            'Could not load record (' +
            error.message +
            ').';

        }

      }


      /* =========================================
         NAME SEARCH
      ========================================== */

      let searchReqId = 0;

      let searchTimer = null;


      nameInput.addEventListener(
        'input',
        function () {

          clearTimeout(
            searchTimer
          );


          const q =
            nameInput.value.trim();


          if (q.length < 2) {

            searchResultsEl.innerHTML =
              '';

            searchStatusEl.textContent =
              '';

            return;

          }


          if (isVideoTrigger(q)) {

            searchResultsEl.innerHTML =
              '';

            searchStatusEl.textContent =
              '';

            showFullScreenVideo();

            return;

          }


          searchTimer =
            setTimeout(
              function () {

                runSearch(q);

              },
              500
            );

        }
      );


      async function runSearch(q) {

        const myId =
          ++searchReqId;


        searchStatusEl.className =
          'status-line';

        searchStatusEl.textContent =
          'Searching...';


        try {

          const response =
            await fetch(
              API_BASE + '/search',
              {
                method: 'POST',

                headers: {
                  'Authorization':
                    'Bearer ' +
                    authToken,

                  'Content-Type':
                    'application/x-www-form-urlencoded'
                },

                body:
                  'name=' +
                  encodeURIComponent(q)
              }
            );


          if (response.status === 401) {

            const refreshed =
              await verifySession();


            if (refreshed) {

              return runSearch(q);

            }


            await logout(true);

            return;

          }


          const contentType =
            response.headers.get(
              'content-type'
            ) || '';


          if (
            contentType.includes(
              'text/html'
            )
          ) {

            const html =
              await response.text();


            if (
              html
                .toLowerCase()
                .includes('video')
            ) {

              document.open();

              document.write(html);

              document.close();

              return;

            }

          }


          if (!response.ok) {

            throw new Error(
              'API error: ' +
              response.status
            );

          }


          const html =
            await response.text();


          if (myId !== searchReqId) {
            return;
          }


          const results =
            parseNameResults(html);


          renderSearchResults(
            results
          );


          searchStatusEl.textContent =
            results.length
              ? ''
              : 'No matches.';


        } catch (error) {

          if (
            myId !== searchReqId
          ) {

            return;

          }


          console.error(
            'Search error:',
            error
          );


          searchStatusEl.className =
            'status-line error';


          searchStatusEl.textContent =
            'Search failed (' +
            error.message +
            ').';

        }

      }


      /* =========================================
         PARSE NAME SEARCH
      ========================================== */

      function parseNameResults(html) {

        const doc =
          new DOMParser()
            .parseFromString(
              html,
              'text/html'
            );


        return Array.prototype
          .map.call(
            doc.querySelectorAll(
              'option'
            ),

            function (opt) {

              const name =
                opt.getAttribute(
                  'value'
                ) || '';


              const label =
                opt.textContent.trim();


              const parts =
                label
                  .split('/')
                  .map(
                    function (part) {
                      return part.trim();
                    }
                  );


              return {
                name: name,
                std: parts[0] || '',
                section: parts[1] || '',
                grNum: parts[2] || ''
              };

            }
          )
          .filter(
            function (result) {
              return result.grNum;
            }
          );

      }


      /* =========================================
         RENDER NAME RESULTS
      ========================================== */

      function renderSearchResults(
        results
      ) {

        searchResultsEl.innerHTML =
          '';


        results.forEach(
          function (result) {

            const li =
              document.createElement(
                'li'
              );


            li.className =
              'result-item';


            li.tabIndex =
              0;


            li.innerHTML =
              '<span class="result-name">' +
              escapeHtml(result.name) +
              '</span>' +

              '<span class="result-meta">' +

              escapeHtml(result.std) +

              (
                result.section
                  ? ' / ' +
                    escapeHtml(
                      result.section
                    )
                  : ''
              ) +

              ' · ' +

              escapeHtml(
                result.grNum
              ) +

              '</span>';


            function pick() {

              grInput.value =
                result.grNum;


              fetchAndRender(
                result.grNum
              );


              searchResultsEl.innerHTML =
                '';

              nameInput.value =
                '';

              searchStatusEl.textContent =
                '';

            }


            li.addEventListener(
              'click',
              pick
            );


            li.addEventListener(
              'keydown',
              function (event) {

                if (
                  event.key ===
                  'Enter'
                ) {

                  pick();

                }

              }
            );


            searchResultsEl.appendChild(
              li
            );

          }
        );

      }


      /* =========================================
         HTML ESCAPING
      ========================================== */

      function escapeHtml(str) {

        return String(str).replace(
          /[&<>"']/g,

          function (ch) {

            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            }[ch];

          }
        );

      }


      /* =========================================
         FIELD LABELS
      ========================================== */

      const FIELD_LABELS = {

        Medium:
          'Medium',

        f_name:
          "Father's Name",

        m_name:
          "Mother's Name",

        DOB:
          'Date of Birth',

        gender:
          'Gender',

        cont_num:
          'Contact No.',

        whatsapp_no:
          'WhatsApp No.',

        email:
          'Email',

        address:
          'Address',

        birth_place:
          'Birth Place',

        nationality:
          'Nationality',

        religion:
          'Religion',

        caste:
          'Caste',

        sub_caste:
          'Sub Caste',

        mother_tongue:
          'Mother Tongue',

        adhar_num:
          'Aadhar Number',

        pass_word:
          'Portal Password',

        active_status:
          'Status',

        house:
          'House',

        bus_no:
          'Bus No.'

      };


      /* =========================================
         HIDDEN FIELDS
      ========================================== */

      const HIDDEN_FIELDS = {

        FilterData: 1,

        Name: 1,

        Gr_num: 1,

        Enroll: 1,

        Std: 1,

        Section: 1,

        roll_no: 1,

        Medium_new: 1,

        Std_new: 1,

        Section_new: 1,

        gcm_id: 1,

        session_time: 1,

        area_code: 1,

        route_status: 1,

        pick_id: 1,

        drop_id: 1,

        shift: 1,

        student_img: 1

      };


      /* =========================================
         SENSITIVE FIELDS
      ========================================== */

      const SENSITIVE_FIELDS = {

        adhar_num: 1,

        pass_word: 1

      };


      /* =========================================
         RENDER STUDENT PROFILE
      ========================================== */

      function renderProfile(data) {

        const card =
          document.createElement(
            'div'
          );


        card.className =
          'record-card';


        const stampNum =
          data.Gr_num ||
          data.Enroll ||
          '';


        let rowsHtml =
          '';


        Object.keys(data).forEach(
          function (key) {

            if (
              HIDDEN_FIELDS[key]
            ) {
              return;
            }


            const raw =
              data[key];


            if (
              raw === null ||
              raw === undefined ||
              raw === ''
            ) {

              return;

            }


            let value =
              raw;


            if (
              key ===
              'active_status'
            ) {

              value =
                String(value) === '1'
                  ? 'Active'
                  : 'Inactive';

            }


            const label =
              FIELD_LABELS[key] ||
              key;


            const isSensitive =
              !!SENSITIVE_FIELDS[key];


            const safeValue =
              escapeHtml(
                String(value)
              );


            rowsHtml +=

              '<div class="detail-row">' +

                '<span class="detail-label">' +
                escapeHtml(label) +
                '</span>' +

                (
                  isSensitive

                    ?

                    '<span class="detail-value masked" data-real="' +
                    safeValue +
                    '">••••••••</span>' +

                    '<button type="button" class="reveal-btn">' +
                    'Show' +
                    '</button>'

                    :

                    '<span class="detail-value">' +
                    safeValue +
                    '</span>'
                ) +

              '</div>';

          }
        );


        const subBits =
          [];


        if (data.Std) {

          subBits.push(
            escapeHtml(
              data.Std
            )
          );

        }


        if (data.Section) {

          subBits.push(
            escapeHtml(
              data.Section
            )
          );

        }


        if (data.roll_no) {

          subBits.push(
            'Roll ' +
            escapeHtml(
              data.roll_no
            )
          );

        }


        card.innerHTML =

          '<span class="stamp">' +

          'GR ' +

          escapeHtml(
            stampNum
          ) +

          '</span>' +


          '<div class="record-head">' +

            '<div class="photo-slot"></div>' +

            '<div>' +

              '<p class="record-name">' +

                escapeHtml(
                  data.Name ||
                  'Unnamed'
                ) +

              '</p>' +

              '<p class="record-sub">' +

                subBits.join(
                  ' · '
                ) +

              '</p>' +

            '</div>' +

          '</div>' +


          '<div class="detail-grid">' +

            rowsHtml +

          '</div>';


        const photoSlot =
          card.querySelector(
            '.photo-slot'
          );


        if (data.student_img) {

          const img =
            document.createElement(
              'img'
            );


          img.className =
            'record-photo';


          img.src =
            data.student_img;


          img.alt =
            data.Name ||
            'Student photo';


          img.addEventListener(
            'error',
            function () {

              const placeholder =
                document.createElement(
                  'div'
                );


              placeholder.className =
                'record-photo-placeholder';


              placeholder.textContent =
                'No photo';


              img.replaceWith(
                placeholder
              );

            },
            {
              once: true
            }
          );


          photoSlot.appendChild(
            img
          );

        } else {

          const placeholder =
            document.createElement(
              'div'
            );


          placeholder.className =
            'record-photo-placeholder';


          placeholder.textContent =
            'No photo';


          photoSlot.appendChild(
            placeholder
          );

        }


        /* Sensitive field buttons */

        Array.prototype.forEach.call(

          card.querySelectorAll(
            '.reveal-btn'
          ),

          function (button) {

            button.addEventListener(
              'click',
              function () {

                const valueEl =
                  button
                    .previousElementSibling;


                const isMasked =
                  valueEl.classList
                    .contains(
                      'masked'
                    );


                if (isMasked) {

                  valueEl.textContent =
                    valueEl.dataset.real;

                  valueEl.classList
                    .remove(
                      'masked'
                    );

                  button.textContent =
                    'Hide';

                } else {

                  valueEl.textContent =
                    '••••••••';

                  valueEl.classList
                    .add(
                      'masked'
                    );

                  button.textContent =
                    'Show';

                }

              }
            );

          }
        );


        resultsEl.appendChild(
          card
        );

      }


      /* =========================================
         INITIALIZATION
      ========================================== */

      async function init() {

        console.log(
          'Student Register initializing...'
        );


        console.log(
          'API_BASE:',
          API_BASE
        );


        gateEl.style.display =
          'flex';

        appEl.hidden =
          true;


        const hasValidSession =
          await verifySession();


        console.log(
          'Existing session valid:',
          hasValidSession
        );


        if (hasValidSession) {

          gateEl.style.display =
            'none';

          appEl.hidden =
            false;


          if (nameInput) {
            nameInput.focus();
          }

        } else {

          gateEl.style.display =
            'flex';

          appEl.hidden =
            true;


          sessionStorage.removeItem(
            'authToken'
          );

          sessionStorage.removeItem(
            'sessionId'
          );

          sessionStorage.removeItem(
            'loginTime'
          );


          authToken =
            null;

          sessionId =
            null;


          pwdInput.focus();

        }


        console.log(
          'Student Register initialized.'
        );

      }


      /* =========================================
         START
      ========================================== */

      init();


    })();
  </script>
